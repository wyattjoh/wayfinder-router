# Example deployment (WF-ADR-0008): the Rust routing gateway service.
# Copy, adjust, and run `docker compose up gateway`.
#
# Point your app's OpenAI-compatible client at http://localhost:8088/v1.
# The ./data volume holds wayfinder-router.toml (the routing + [gateway.models] config)
# and wayfinder-router-feedback.jsonl (the label log). Keys come from the environment,
# referenced by name via each model's api_key_env, never stored in the image.

services:
  gateway:
    build: .
    ports:
      - "8088:8088"
    volumes:
      - ./data:/data            # wayfinder-router.toml + wayfinder-router-feedback.jsonl
    environment:
      # The names here must match the api_key_env values in wayfinder-router.toml.
      - EXAMPLE_API_KEY=${EXAMPLE_API_KEY:-}
    command: ["wayfinder-router", "serve", "--host", "0.0.0.0", "--port", "8088"]
    restart: unless-stopped
