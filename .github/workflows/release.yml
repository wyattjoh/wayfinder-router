name: Release

on:
  push:
    tags:
      - "v*"
      - "[0-9]*"

permissions:
  contents: write
  packages: write

jobs:
  binary:
    runs-on: ubuntu-latest
    env:
      BINARY_NAME: wayfinder-router
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Rust binary
        run: cargo build --release --bin "$BINARY_NAME"
      - name: Smoke-test Rust binary
        run: ./target/release/"$BINARY_NAME" --help
      - name: Package Rust binary
        run: |
          mkdir -p dist package
          cp "target/release/$BINARY_NAME" "package/$BINARY_NAME"
          tar -C package -czf "dist/$BINARY_NAME-$GITHUB_REF_NAME-linux-x86_64.tar.gz" "$BINARY_NAME"
          sha256sum "dist/$BINARY_NAME-$GITHUB_REF_NAME-linux-x86_64.tar.gz" \
            > "dist/$BINARY_NAME-$GITHUB_REF_NAME-linux-x86_64.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: wayfinder-router-linux-x86_64
          path: |
            dist/wayfinder-router-*-linux-x86_64.tar.gz
            dist/wayfinder-router-*-linux-x86_64.tar.gz.sha256
      - name: Publish GitHub release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "$GITHUB_REF_NAME" \
              --notes "Rust binary release for $GITHUB_REF_NAME"
          fi

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compute image tag
        id: image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tag="${GITHUB_REF_NAME//\//-}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "tag=$image:$tag" >> "$GITHUB_OUTPUT"
      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build image
        run: docker build -t "${{ steps.image.outputs.tag }}" .
      - name: Push image
        run: docker push "${{ steps.image.outputs.tag }}"
