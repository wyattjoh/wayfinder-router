[package]
name = "wayfinder-internal-gateway"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "wayfinder_internal_gateway"
path = "src/lib.rs"

[[bin]]
name = "wayfinder-router-gateway"
path = "src/main.rs"

[dependencies]
axum = "0.7"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
toml = "0.8"
wayfinder-internal-core = { path = "../wayfinder-core" }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
