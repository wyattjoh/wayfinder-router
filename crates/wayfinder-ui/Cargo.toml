[package]
name = "wayfinder-internal-ui"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "wayfinder_internal_ui"
path = "src/lib.rs"

[[bin]]
name = "wayfinder-router-ui"
path = "src/main.rs"

[dependencies]
axum = "0.7"
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
wayfinder-internal-core = { path = "../wayfinder-core" }
wayfinder-internal-gateway = { path = "../wayfinder-gateway" }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
