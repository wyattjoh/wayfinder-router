[package]
name = "wayfinder-internal-tui"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "wayfinder_internal_tui"
path = "src/lib.rs"

[[bin]]
name = "wayfinder-router-tui"
path = "src/main.rs"

[dependencies]
wayfinder-internal-core = { path = "../wayfinder-core" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "1"
